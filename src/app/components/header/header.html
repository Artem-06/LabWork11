<nav class="navbar bg-info navbar-expand-lg">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="#">
      <img
        ngSrc="https://getbootstrap.com/docs/5.3/assets/brand/bootstrap-logo.svg"
        width="30"
        height="24"
        class="custom-logo me-2"
        alt="Logo"
      />
      <span>SPA-технології</span>
    </a>
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
      aria-controls="navbarNav"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        @for (link of links; track link) {
          <li class="nav-item">
            <a [routerLink]="link.path" routerLinkActive="active" class="nav-link">
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </div>
  </div>
</nav>
