<div id="carouselExampleControlsNoTouching" class="carousel slide" data-bs-touch="false">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <div class="img_card" (click)="flipImg()">
        <div *appIf="!isFlipped" class="card__front">
          <img
            ngSrc="images/carousel/Otori.webp"
            alt="Emu Otori chibi"
            fill
          />
        </div>
        <div *appIf="isFlipped" class="card__back">
          <a class="btn btn-light btn-lg shadow-lg" href="https://youtu.be/SUm-7_KPY6I">Link</a>
        </div>
      </div>
    </div>
    <div class="carousel-item">
      <img
        ngSrc="images/carousel/img_illust_mikuv6.webp"
        alt="Hatsune Miku V6"
        fill
      />
    </div>
    <div class="carousel-item">
      <img
        ngSrc="images/carousel/PADORU with text.png"
        alt="PADORU PADORU"
        fill
      />
    </div>
    <div class="carousel-item">
      <img
        ngSrc="images/carousel/Job-Application.webp"
        alt="Job Application"
        fill
      />
    </div>
  </div>
  <button
    class="carousel-control-prev align-items-end"
    type="button"
    data-bs-target="#carouselExampleControlsNoTouching"
    data-bs-slide="prev"
  >
    <div class="custom-arrow">
      <img ngSrc="images/Uzi.png" height="300" width="300" alt="Uzi" />
    </div>
    <span class="visually-hidden">Previous</span>
  </button>
  <button
    class="carousel-control-next align-items-end"
    type="button"
    data-bs-target="#carouselExampleControlsNoTouching"
    data-bs-slide="next"
  >
    <div class="custom-arrow">
      <img ngSrc="images/N.png" height="300" width="300" alt="N" />
    </div>
    <span class="visually-hidden">Next</span>
  </button>
</div>
